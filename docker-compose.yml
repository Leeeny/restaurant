services:
  menu-service:
    image: menu-service # в сервисе запустить gradle bootBuildImage
    container_name: "menu-service"
    depends_on:
      menu-postgres:
        condition: service_healthy
    ports:
      - "8091:8091"
    environment:
      POSTGRES_HOST: menu-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: menu-user
      POSTGRES_PASSWORD: menu1234
    healthcheck:
      test: [ "CMD", "curl", "-i", "http://localhost:8091/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 30


  menu-postgres:
    image: postgres:17
    container_name: menu-postgres
    environment:
      POSTGRES_USER: menu-user
      POSTGRES_PASSWORD: menu1234
      POSTGRES_DB: menu
    volumes:
      - ./infrastructure/databases/menu:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -p 5432" ]
      interval: 10s
      timeout: 5s
      retries: 20