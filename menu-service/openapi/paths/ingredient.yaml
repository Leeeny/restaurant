ingredients:
  post:
    summary: Create a new ingredient
    operationId: createIngredient
    tags:
      - Ingredient
    security:
      - bearerAuth: [ ]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateIngredientRequest'
    responses:
      '201':
        description: Ingredient successfully created
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/IngredientResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '409':
        $ref: '../components/responses.yaml#/Conflict'

  get:
    summary: Get a list of ingredients
    operationId: getIngredients
    tags:
      - Ingredient
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/NameFilterParam'
      - $ref: '../components/parameters.yaml#/PageParam'
      - $ref: '../components/parameters.yaml#/SizeParam'
    responses:
      '200':
        description: List of ingredients
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/IngredientPageResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'

ingredientById:
  get:
    summary: Get an ingredient by id
    operationId: getIngredientById
    tags:
      - Ingredient
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPathParam'
    responses:
      '200':
        description: Successfully retrieved
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/IngredientResponse'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  patch:
    summary: Patch update for an ingredient
    operationId: updateIngredient
    tags:
      - Ingredient
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPathParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/UpdateIngredientRequest'
    responses:
      '200':
        description: Successfully updated
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/IngredientResponse'
      '400':
        $ref: '../components/responses.yaml#/BadRequest'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'

  delete:
    summary: Delete an ingredient by id
    operationId: deleteIngredient
    tags:
      - Ingredient
    security:
      - bearerAuth: [ ]
    parameters:
      - $ref: '../components/parameters.yaml#/IdPathParam'
    responses:
      '204':
        $ref: '../components/responses.yaml#/NoContent'
      '401':
        $ref: '../components/responses.yaml#/Unauthorized'
      '403':
        $ref: '../components/responses.yaml#/Forbidden'
      '404':
        $ref: '../components/responses.yaml#/NotFound'
      '409':
        $ref: '../components/responses.yaml#/Conflict'