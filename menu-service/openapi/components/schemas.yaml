# ---------------------------------------------------------------------------
# MenuItem
# ---------------------------------------------------------------------------

MenuItemResponse:
  type: object
  required:
    [
      id,
      name,
      description,
      active,
      price,
      categoryId,
      cookTimeMinutes,
      weightGrams,
      createdAt,
      updatedAt
    ]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
    active:
      type: boolean
    price:
      type: number
    categoryId:
      type: integer
      format: int64
    cookTimeMinutes:
      type: integer
      format: int32
    weightGrams:
      type: number
    imageUrl:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

MenuItemPageResponse:
  type: object
  required: [ content, page, size, totalElements, totalPages ]
  properties:
    content:
      type: array
      items:
        $ref: '#/MenuItemResponse'
    page:
      type: integer
      format: int32
    size:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
    totalPages:
      type: integer
      format: int32

CreateMenuItemRequest:
  type: object
  required:
    [
      name,
      description,
      price,
      categoryId,
      cookTimeMinutes,
      weightGrams
    ]
  properties:
    name:
      type: string
      maxLength: 128
    description:
      type: string
    active:
      type: boolean
      default: true
    price:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
    categoryId:
      type: integer
      format: int64
    cookTimeMinutes:
      type: integer
      format: int32
      minimum: 0
    weightGrams:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
    imageUrl:
      type: string
      nullable: true
  additionalProperties: false

UpdateMenuRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 128
    description:
      type: string
    active:
      type: boolean
    price:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
    categoryId:
      type: integer
      format: int64
    cookTimeMinutes:
      type: integer
      format: int32
      minimum: 0
    weightGrams:
      type: number
      format: double
      minimum: 0
      exclusiveMinimum: true
    imageUrl:
      type: string
      nullable: true
  additionalProperties: false

MenuItemIngredientResponse:
  type: object
  required:
    - ingredientId
    - ingredientName
    - caloriesPer100g
    - weightGrams
  properties:
    ingredientId:
      type: integer
      format: int64

    ingredientName:
      type: string

    caloriesPer100g:
      type: number
      format: double

    weightGrams:
      type: number
      format: double


MenuItemIngredientPageResponse:
  type: object
  required:
    - content
    - page
    - size
    - totalElements
    - totalPages
  properties:
    content:
      type: array
      items:
        $ref: '#/MenuItemIngredientResponse'

    page:
      type: integer
      format: int32

    size:
      type: integer
      format: int32

    totalElements:
      type: integer
      format: int64

    totalPages:
      type: integer
      format: int32


CreateMenuItemIngredientRequest:
  type: object
  required:
    - ingredientId
    - weightGrams
  properties:
    ingredientId:
      type: integer
      format: int64

    weightGrams:
      type: number
      format: double
      minimum: 0.01

  additionalProperties: false


UpdateMenuItemIngredientRequest:
  type: object
  required:
    - weightGrams
  properties:
    weightGrams:
      type: number
      format: double
      minimum: 0.01

  additionalProperties: false

# Соответствует ru.leeeny.menuservice.dto.SortBy.
# При генерации маппится на реальный enum через schemaMappings в build.gradle.kts,
# так что значения ниже нужны только для документации/клиентов, но обязаны
# 1-в-1 совпадать с константами Java enum.
SortBy:
  type: string
  enum:
    - AZ
    - ZA
    - PRICE_ASC
    - PRICE_DESC
    - WEIGHT_ASC
    - WEIGHT_DESC
    - DATE_ASC
    - DATE_DESC
    - CATEGORY_ASC
    - CATEGORY_DESC

# ---------------------------------------------------------------------------
# MenuCategory
# ---------------------------------------------------------------------------

MenuCategoryResponse:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int64

    name:
      type: string
      maxLength: 128

MenuCategoryPageResponse:
  type: object
  required:
    - content
    - page
    - size
    - totalElements
    - totalPages
  properties:
    content:
      type: array
      items:
        $ref: '#/MenuCategoryResponse'

    page:
      type: integer
      format: int32

    size:
      type: integer
      format: int32

    totalElements:
      type: integer
      format: int64

    totalPages:
      type: integer
      format: int32

CreateMenuCategoryRequest:
  type: object
  required:
    - name
  properties:
    name:
      type: string
      maxLength: 128

  additionalProperties: false

UpdateMenuCategoryRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 128

  additionalProperties: false

# ---------------------------------------------------------------------------
# Ingredient
# ---------------------------------------------------------------------------

IngredientResponse:
  type: object
  required:
    - id
    - name
    - caloriesPer100g
  properties:
    id:
      type: integer
      format: int64

    name:
      type: string
      maxLength: 128

    caloriesPer100g:
      type: number
      format: double
      description: Calories per 100 grams

IngredientPageResponse:
  type: object
  required:
    - content
    - page
    - size
    - totalElements
    - totalPages
  properties:
    content:
      type: array
      items:
        $ref: '#/IngredientResponse'

    page:
      type: integer
      format: int32

    size:
      type: integer
      format: int32

    totalElements:
      type: integer
      format: int64

    totalPages:
      type: integer
      format: int32

CreateIngredientRequest:
  type: object
  required:
    - name
    - caloriesPer100g
  properties:
    name:
      type: string
      maxLength: 128

    caloriesPer100g:
      type: number
      format: double
      minimum: 0

  additionalProperties: false

UpdateIngredientRequest:
  type: object
  properties:
    name:
      type: string
      maxLength: 128

    caloriesPer100g:
      type: number
      format: double
      minimum: 0

  additionalProperties: false

# ---------------------------------------------------------------------------
# Общие
# ---------------------------------------------------------------------------

ErrorResponse:
  type: object
  properties:
    message:
      type: string
    status:
      type: integer
